<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQI Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: linear-gradient(to right, #1e3c72, #2a5298);
  color: white;
}

/* HEADER */
.header {
  text-align: center;
  padding: 12px;
  font-size: 18px;
  background: linear-gradient(to right, #1e3c72, #2a5298);
}

/* SCREEN */
.screen { display: none; padding-bottom: 60px; }
.active { display: block; }

/* CARDS */
.container {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  padding: 12px;
  border-radius: 12px;
  text-align: center;
}



.value {
  font-size: 18px;
  font-weight: bold;
}

/* AQI BOX */
.aqi-box {
  text-align: center;
  font-size: 22px;
  margin: 10px;
  padding: 12px;
  border-radius: 10px;
}

/* WARNING */
.warning-box {
  display: none;
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

/* GRAPH */
.graph-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 10px;
}

.graph-card {
  background: rgba(255,255,255,0.08);
  padding: 10px;
  border-radius: 12px;
}

canvas {
  width: 100% !important;
  height: 220px !important;
  background: #111;
  border-radius: 10px;
}

/* NAV */
.navbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: linear-gradient(to right, #56ccf2, #2f80ed);
}

.nav-btn {
  flex: 1;
  padding: 12px;
  text-align: center;
  cursor: pointer;
}

.nav-btn.active {
  background: linear-gradient(to right, #56ccf2, #2f80ed);
}
</style>
</head>

<body>

<div class="header">🌍 AQI Monitor</div>

<!-- HOME -->
<div id="home" class="screen active">

<div class="container">
  <div class="card">Temp (°C)<div id="temp" class="value">--</div></div>
<div class="card">ALCOHOL,NH3,BENEZENE (ppm)<div id="mq135" class="value">--</div></div>
<div class="card">CO (ppm)<div id="mq7" class="value">--</div></div>
<div class="card">PM2.5 (µg/m³)<div id="pm25" class="value">--</div></div>
</div>

<div class="aqi-box" id="aqiBox">
  AQI: <span id="aqi">--</span>
</div>

<div id="warningBox" class="warning-box"></div>

</div>

<!-- GRAPH -->
<div id="graph" class="screen">
<div class="graph-container">

<div class="graph-card">
  <canvas id="aqiChart"></canvas>
</div>

<div class="graph-card">
  <canvas id="tempChart"></canvas>
</div>

<div class="graph-card">
  <canvas id="mqChart"></canvas>
</div>

<div class="graph-card">
  <canvas id="pmChart"></canvas>
</div>

</div>
</div>

<!-- NAV -->
<div class="navbar">
  <div class="nav-btn active" onclick="showScreen('home', this)">🏠 Home</div>
  <div class="nav-btn" onclick="showScreen('graph', this)">📊 Graph</div>
</div>

<script>

const BASE_URL = "YOUR_SERVER_IP"; //Add your IP address of the server running

// SWITCH SCREEN
function showScreen(id, btn){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

// AQI COLOR
function getColor(aqi){
  if(aqi<=50) return "#22c55e";
  if(aqi<=100) return "#eab308";
  if(aqi<=200) return "#f97316";
  return "#ef4444";
}

// HEALTH MESSAGE
function getHealth(aqi){
  if(aqi<=50) return ["Good 😊","Air quality is excellent"];
  if(aqi<=100) return ["Moderate 😐","Take care"];
  if(aqi<=200) return ["Unhealthy 😷","Limit outdoor exposure"];
  if(aqi<=300) return ["Very Unhealthy 🤢","Avoid outdoor"];
  return ["Hazardous ☠️","Stay indoors"];
}

// CREATE CHART
function createChart(id, label, color){
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: label,
        data: [],
        borderColor: color,
        borderWidth: 3,
        tension: 0.4,
        pointRadius: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: "white" } }
      },
      scales: {
        x: {
          ticks: { color: "white" },
          grid: { color: "rgba(255,255,255,0.1)" }
        },
        y: {
          beginAtZero: true,
          ticks: { color: "white" },
          grid: { color: "rgba(255,255,255,0.1)" }
        }
      }
    }
  });
}

// INIT CHARTS
let aqiChart = createChart("aqiChart","AQI","#ef4444");
let tempChart = createChart("tempChart","Temperature","#3b82f6");

let mqChart = new Chart(document.getElementById("mqChart"),{
  type:'line',
  data:{
    labels:[],
    datasets:[
      {label:"NH3",data:[],borderColor:"#22c55e",borderWidth:3},
      {label:"CO",data:[],borderColor:"#eab308",borderWidth:3}
    ]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{ legend:{labels:{color:"white"}} },
    scales:{
      x:{ticks:{color:"white"}},
      y:{beginAtZero:true,ticks:{color:"white"}}
    }
  }
});

let pmChart = createChart("pmChart","PM2.5","#f97316");

// FETCH DATA
async function fetchData(){
  try{
    let res = await fetch(BASE_URL + "/data");
    let data = await res.json();

    if(data.pm25 === undefined) return;

    let pred = await fetch(BASE_URL + "/predict", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    let result = await pred.json();
    let aqi = Math.round(result.AQI);

    // UI UPDATE
    document.getElementById("temp").innerText = data.temperature?.toFixed(1) || "--";
    document.getElementById("mq135").innerText = data.nh3.toFixed(2);
    document.getElementById("mq7").innerText = data.co.toFixed(2);
    document.getElementById("pm25").innerText = data.pm25.toFixed(1);
    document.getElementById("aqi").innerText = aqi;

    let aqiBox = document.getElementById("aqiBox");
    let color = getColor(aqi);
    aqiBox.style.background = color;
    aqiBox.style.color = (aqi <= 100) ? "black" : "white";

    let [status,msg]=getHealth(aqi);
    let box=document.getElementById("warningBox");
    box.style.display="block";
    box.innerHTML=`<b>${status}</b><br>${msg}`;

    let time = new Date().toLocaleTimeString();

    // GRAPH UPDATE
    aqiChart.data.labels.push(time);
    aqiChart.data.datasets[0].data.push(aqi);

    tempChart.data.labels.push(time);
    tempChart.data.datasets[0].data.push(data.temperature || null);

    mqChart.data.labels.push(time);
    mqChart.data.datasets[0].data.push(data.nh3 || null);
    mqChart.data.datasets[1].data.push(data.co || null);

    pmChart.data.labels.push(time);
    pmChart.data.datasets[0].data.push(data.pm25 || null);

    [aqiChart,tempChart,mqChart,pmChart].forEach(c=>{
      if(c.data.labels.length>10){
        c.data.labels.shift();
        c.data.datasets.forEach(d=>d.data.shift());
      }
      c.update();
    });

  }catch(err){
    console.log("ERROR:", err);
  }
}

setInterval(fetchData,3000);
fetchData();

</script>

</body>
</html>
